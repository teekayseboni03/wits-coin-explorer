<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WitsCoin Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:    #4059AD;
      --sky:     #6B9AC4;
      --mint:    #97D8C4;
      --cream:   #EFF2F1;
      --gold:    #F4B942;

      --navy-dk: #2f4488;
      --sky-lt:  #d0e5f3;
      --mint-lt: #d6f2eb;
      --gold-lt: #fdf2d8;
      --gold-dk: #c4901a;

      --bg:           #EFF2F1;
      --bg-secondary: #ffffff;
      --bg-tertiary:  #e3e8e6;
      --text-primary:   #18243f;
      --text-secondary: #4059AD;
      --text-muted:     #7b8fa8;
      --border:     rgba(64,89,173,0.13);
      --border-md:  rgba(64,89,173,0.28);
      --radius-md: 8px;
      --radius-lg: 14px;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'DM Sans', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:           #141b2d;
        --bg-secondary: #1c2640;
        --bg-tertiary:  #111827;
        --text-primary:   #EFF2F1;
        --text-secondary: #97D8C4;
        --text-muted:     #6B9AC4;
        --border:     rgba(151,216,196,0.12);
        --border-md:  rgba(151,216,196,0.25);
        --navy-dk: #6B9AC4;
        --gold:    #F4B942;
        --gold-lt: #2e2200;
        --gold-dk: #F4B942;
        --mint-lt: #0d2820;
        --sky-lt:  #0e1e2e;
      }
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2.5rem 1.25rem;
    }

    .container { max-width: 880px; margin: 0 auto; }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 1.75rem;
    }

    .logo {
      width: 46px; height: 46px;
      border-radius: 13px;
      background: var(--navy);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 600;
      color: var(--gold);
      font-family: var(--font-mono);
      box-shadow: 0 2px 0 var(--navy-dk);
    }

    .title { font-size: 20px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.02em; }
    .subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-weight: 400; }

    .refresh-btn {
      margin-left: auto;
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 500; cursor: pointer;
      color: var(--text-muted);
      background: var(--bg-secondary);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 7px 13px;
      font-family: var(--font-sans);
      transition: color 0.15s, border-color 0.15s;
    }
    .refresh-btn:hover { color: var(--navy); border-color: var(--border-md); }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .stat {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      border: 0.5px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .stat::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--navy), var(--sky));
    }

    .stat-label {
      font-size: 11px; font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 8px;
    }
    .stat-val { font-size: 24px; font-weight: 600; color: var(--text-primary); font-family: var(--font-mono); }

    /* ── Card ── */
    .card-wrap {
      background: var(--bg-secondary);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      border-bottom: 0.5px solid var(--border);
      padding: 0 1rem;
      background: var(--bg);
    }
    .tab {
      padding: 13px 16px;
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -0.5px;
      background: none;
      border-top: none; border-left: none; border-right: none;
      font-family: var(--font-sans);
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy); border-bottom-color: var(--navy); }
    .tab:hover:not(.active) { color: var(--text-primary); }

    .panel { display: none; padding: 1.25rem; }
    .panel.active { display: block; }

    .section-top { display: flex; align-items: center; margin-bottom: 14px; }
    .section-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; }

    /* ── Block cards ── */
    .block-card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .block-card:hover { border-color: var(--border-md); box-shadow: 0 2px 10px rgba(64,89,173,0.07); }

    .block-head { display: flex; align-items: flex-start; justify-content: space-between; }
    .chain-line { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-muted); margin-bottom: 3px; font-family: var(--font-mono); }
    .chain-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); }
    .block-num { font-size: 16px; font-weight: 600; color: var(--navy); font-family: var(--font-mono); }
    .block-time { font-size: 11px; color: var(--text-muted); }

    .block-hash {
      font-size: 10px; color: var(--text-muted);
      margin-top: 8px; font-family: var(--font-mono);
      word-break: break-all; line-height: 1.5;
      background: var(--bg-secondary);
      border: 0.5px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
    }

    .block-meta {
      display: flex; flex-wrap: wrap; gap: 12px;
      margin-top: 10px; font-size: 11px; color: var(--text-muted);
    }

    .block-detail { display: none; margin-top: 12px; border-top: 0.5px solid var(--border); padding-top: 12px; }
    .block-detail.open { display: block; }
    .expand-hint { font-size: 10px; color: var(--text-muted); margin-top: 8px; }

    /* ── Transactions ── */
    .tx-row {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 0.5px solid var(--border);
      font-size: 11px; gap: 8px;
    }
    .tx-row:last-child { border-bottom: none; }
    .tx-addr { color: var(--text-muted); font-family: var(--font-mono); font-size: 10px; }
    .tx-arrow { color: var(--mint); font-weight: 600; }
    .tx-amount { font-weight: 600; color: var(--text-primary); font-family: var(--font-mono); white-space: nowrap; }

    .badge { font-size: 10px; font-weight: 500; padding: 2px 9px; border-radius: 99px; white-space: nowrap; font-family: var(--font-sans); }
    .badge-pending  { background: var(--gold-lt); color: var(--gold-dk); border: 0.5px solid rgba(244,185,66,0.4); }
    .badge-confirmed { background: var(--mint-lt); color: #0b6b50; border: 0.5px solid rgba(151,216,196,0.4); }

    /* ── Wallet lookup ── */
    .search-row { display: flex; gap: 8px; margin-bottom: 1rem; }
    .search-row input {
      flex: 1;
      padding: 10px 13px;
      font-size: 13px;
      font-family: var(--font-mono);
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-row input::placeholder { color: var(--text-muted); opacity: 0.7; }
    .search-row input:focus { border-color: var(--sky); box-shadow: 0 0 0 3px rgba(107,154,196,0.15); }
    .search-row button {
      padding: 10px 18px;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      transition: background 0.15s, transform 0.1s;
      display: flex; align-items: center; gap: 6px;
    }
    .search-row button:hover { background: var(--navy-dk); }
    .search-row button:active { transform: scale(0.97); }

    .wallet-result {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
    }
    .wallet-balance-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 6px; }
    .wallet-balance { font-size: 36px; font-weight: 600; color: var(--navy); font-family: var(--font-mono); }
    .wallet-balance span { font-size: 20px; color: var(--gold-dk); }
    .wallet-addr { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 8px; word-break: break-all; }

    /* ── States ── */
    .empty { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 13px; }
    .empty i { font-size: 30px; display: block; margin-bottom: 12px; opacity: 0.4; }
    .error-msg {
      background: #fff0f0; color: #a32020;
      border: 0.5px solid rgba(163,32,32,0.2);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 12px; margin-bottom: 12px;
    }
    .loading { color: var(--text-muted); font-size: 13px; padding: 2rem 0; text-align: center; }

    footer { text-align: center; margin-top: 2rem; font-size: 11px; color: var(--text-muted); }
    footer a { color: var(--navy); text-decoration: none; font-weight: 500; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <div class="logo">₩</div>
      <div>
        <div class="title">WitsCoin Explorer</div>
        <div class="subtitle">COMS4065A · University of the Witwatersrand</div>
      </div>
      <button class="refresh-btn" onclick="refreshAll()">
        <i class="ti ti-refresh"></i> Refresh
      </button>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-label">Latest block</div><div class="stat-val" id="s-block">—</div></div>
      <div class="stat"><div class="stat-label">Difficulty</div><div class="stat-val" id="s-diff">—</div></div>
      <div class="stat"><div class="stat-label">Mining reward</div><div class="stat-val" id="s-reward">—</div></div>
      <div class="stat"><div class="stat-label">Pending transactions</div><div class="stat-val" id="s-pending">—</div></div>
    </div>

    <div class="card-wrap">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('blocks', this)">Blocks</button>
        <button class="tab" onclick="switchTab('pending', this)">Pending txns</button>
        <button class="tab" onclick="switchTab('wallet', this)">Wallet lookup</button>
      </div>

      <div class="panel active" id="panel-blocks">
        <div class="section-top">
          <span class="section-title">Recent blocks</span>
          <button class="refresh-btn" style="margin-left:auto" onclick="loadBlocks()"><i class="ti ti-refresh"></i></button>
        </div>
        <div id="blocks-list"><div class="loading">Loading blocks…</div></div>
      </div>

      <div class="panel" id="panel-pending">
        <div class="section-top">
          <span class="section-title">Pending transactions</span>
          <button class="refresh-btn" style="margin-left:auto" onclick="loadPending()"><i class="ti ti-refresh"></i></button>
        </div>
        <div id="pending-list"><div class="loading">Loading…</div></div>
      </div>

      <div class="panel" id="panel-wallet">
        <div class="search-row">
          <input type="text" id="wallet-input" placeholder="Enter wallet address (wc_...)" />
          <button onclick="lookupWallet()"><i class="ti ti-search"></i> Look up</button>
        </div>
        <div id="wallet-result"></div>
      </div>
    </div>

    <footer>
      Built for COMS4065A · Data from <a href="https://witscoin.com" target="_blank">witscoin.com</a>
    </footer>
  </div>

  <script>
    const BASE = 'https://witscoin.com';

    function switchTab(name, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('panel-' + name).classList.add('active');
      if (name === 'pending') loadPending();
    }

    function fmt(ts) {
      if (!ts) return '';
      return new Date(ts * 1000).toLocaleString('en-ZA', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function shortAddr(a) {
      if (!a) return '—';
      return a.length > 22 ? a.slice(0, 10) + '…' + a.slice(-6) : a;
    }

    async function fetchJSON(url) {
      const r = await fetch(BASE + url, { headers: { 'Accept': 'application/json' } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }

    async function loadStats() {
      try {
        const [info, latest, pending] = await Promise.all([
          fetchJSON('/info'),
          fetchJSON('/blockchain/latest'),
          fetchJSON('/problem4/pending')
        ]);
        document.getElementById('s-block').textContent = latest.block_number ?? latest.index ?? '—';
        document.getElementById('s-diff').textContent = info.mining_difficulty ?? '—';
        document.getElementById('s-reward').textContent = (info.mining_reward ?? '—') + ' ₩';
        const pArr = Array.isArray(pending) ? pending : (pending.transactions ?? pending.pending ?? []);
        document.getElementById('s-pending').textContent = pArr.length;
      } catch(e) { console.warn('Stats error', e); }
    }

    function renderTx(tx, confirmed) {
      const badge = confirmed
        ? '<span class="badge badge-confirmed">confirmed</span>'
        : '<span class="badge badge-pending">pending</span>';
      return `<div class="tx-row">
        <div style="min-width:0;flex:1">
          <div class="tx-addr">${shortAddr(tx.from_address || tx.from || tx.sender)} <span class="tx-arrow">→</span> ${shortAddr(tx.to_address || tx.to || tx.recipient)}</div>
          ${tx.timestamp ? `<div style="font-size:10px;color:var(--text-muted);margin-top:2px">${fmt(tx.timestamp)}</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span class="tx-amount">${tx.amount} ₩</span>
          ${badge}
        </div>
      </div>`;
    }

    function renderBlock(b, idx) {
      const txs = Array.isArray(b.transactions) ? b.transactions : [];
      const txHtml = txs.length
        ? txs.map(t => renderTx(t, true)).join('')
        : '<div style="font-size:11px;color:var(--text-muted);padding:6px 0">No transactions in this block</div>';

      return `<div class="block-card" onclick="toggleBlock(this)">
        <div class="block-head">
          <div>
            <div class="chain-line"><span class="chain-dot"></span> block</div>
            <div class="block-num">#${b.block_number ?? b.index ?? idx}</div>
          </div>
          <div style="text-align:right">
            <div class="block-time">${fmt(b.timestamp)}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:3px">${txs.length} txn${txs.length !== 1 ? 's' : ''} · <span style="color:var(--gold-dk);font-weight:600">${b.reward ?? 50} ₩</span> reward</div>
          </div>
        </div>
        <div class="block-hash">${b.hash || b.current_hash || ''}</div>
        <div class="block-meta">
          <span><i class="ti ti-user" style="font-size:12px;vertical-align:-1px"></i> ${shortAddr(b.miner_address || b.miner)}</span>
          <span><i class="ti ti-cube" style="font-size:12px;vertical-align:-1px"></i> nonce: ${b.nonce ?? '—'}</span>
        </div>
        <div class="expand-hint">click to ${txs.length ? 'view transactions' : 'expand'} ↓</div>
        <div class="block-detail">${txHtml}</div>
      </div>`;
    }

    function toggleBlock(el) {
      el.querySelector('.block-detail').classList.toggle('open');
      const hint = el.querySelector('.expand-hint');
      hint.textContent = el.querySelector('.block-detail').classList.contains('open') ? 'click to collapse ↑' : 'click to expand ↓';
    }

    async function loadBlocks() {
      const el = document.getElementById('blocks-list');
      el.innerHTML = '<div class="loading">Fetching blocks…</div>';
      try {
        const data = await fetchJSON('/blockchain/blocks');
        const blocks = Array.isArray(data) ? data : (data.blocks ?? data.chain ?? []);
        if (!blocks.length) { el.innerHTML = '<div class="empty">No blocks found.</div>'; return; }
        const sorted = [...blocks].sort((a, b) => (b.block_number ?? b.index ?? 0) - (a.block_number ?? a.index ?? 0));
        el.innerHTML = sorted.map((b, i) => renderBlock(b, i)).join('');
      } catch(e) {
        el.innerHTML = '<div class="error-msg"><i class="ti ti-alert-circle"></i> Failed to load blocks: ' + e.message + '</div>';
      }
    }

    async function loadPending() {
      const el = document.getElementById('pending-list');
      el.innerHTML = '<div class="loading">Fetching pending transactions…</div>';
      try {
        const data = await fetchJSON('/problem4/pending');
        const txs = Array.isArray(data) ? data : (data.transactions ?? data.pending ?? []);
        if (!txs.length) {
          el.innerHTML = '<div class="empty"><i class="ti ti-checks"></i>No pending transactions right now</div>';
          return;
        }
        el.innerHTML = txs.map(t => `<div class="block-card" style="cursor:default">${renderTx(t, false)}</div>`).join('');
      } catch(e) {
        el.innerHTML = '<div class="error-msg"><i class="ti ti-alert-circle"></i> Failed to load: ' + e.message + '</div>';
      }
    }

    async function lookupWallet() {
      const addr = document.getElementById('wallet-input').value.trim();
      const el = document.getElementById('wallet-result');
      if (!addr) { el.innerHTML = '<div class="error-msg">Please enter a wallet address.</div>'; return; }
      el.innerHTML = '<div class="loading">Looking up…</div>';
      try {
        const data = await fetchJSON('/balance/' + encodeURIComponent(addr));
        el.innerHTML = `<div class="wallet-result">
          <div class="wallet-balance-label">Balance</div>
          <div class="wallet-balance">${Number(data.balance ?? 0).toLocaleString('en-ZA')} <span>₩</span></div>
          <div class="wallet-addr">${data.address ?? addr}</div>
        </div>`;
      } catch(e) {
        el.innerHTML = '<div class="error-msg">Wallet not found or server error: ' + e.message + '</div>';
      }
    }

    document.getElementById('wallet-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') lookupWallet();
    });

    function refreshAll() { loadStats(); loadBlocks(); }
    refreshAll();
  </script>
</body>
</html>
