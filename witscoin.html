<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WitsCoin Explorer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f4f0;
      --bg-tertiary: #eceae3;
      --text-primary: #1a1a18;
      --text-secondary: #6b6a65;
      --text-tertiary: #9e9d98;
      --border: rgba(0,0,0,0.12);
      --border-md: rgba(0,0,0,0.22);
      --success-bg: #eaf3de;
      --success-text: #3b6d11;
      --warning-bg: #faeeda;
      --warning-text: #854f0b;
      --danger-bg: #fcebeb;
      --danger-text: #a32d2d;
      --gold: #BA7517;
      --gold-light: #FAEEDA;
      --radius-md: 8px;
      --radius-lg: 12px;
      --font-mono: 'JetBrains Mono', 'Fira Mono', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg-secondary: #252523;
        --bg-tertiary: #2e2e2b;
        --text-primary: #f0ede6;
        --text-secondary: #9e9d98;
        --text-tertiary: #6b6a65;
        --border: rgba(255,255,255,0.1);
        --border-md: rgba(255,255,255,0.2);
        --success-bg: #173404;
        --success-text: #c0dd97;
        --warning-bg: #412402;
        --warning-text: #FAC775;
        --danger-bg: #501313;
        --danger-text: #F7C1C1;
        --gold: #EF9F27;
        --gold-light: #412402;
      }
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 1.5rem;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--gold-light);
      border: 1.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: var(--gold);
      font-family: var(--font-sans);
    }

    .title { font-size: 20px; font-weight: 600; color: var(--text-primary); }
    .subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    .refresh-btn {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text-secondary);
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 7px 12px;
      font-family: var(--font-sans);
      transition: color 0.15s;
    }
    .refresh-btn:hover { color: var(--text-primary); border-color: var(--border-md); }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .stat {
      background: var(--bg);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      border: 0.5px solid var(--border);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .stat-val { font-size: 22px; font-weight: 600; color: var(--text-primary); font-family: var(--font-mono); }

    .card-wrap {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .tabs {
      display: flex;
      border-bottom: 0.5px solid var(--border);
      padding: 0 1rem;
    }

    .tab {
      padding: 12px 16px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text-secondary);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-family: var(--font-sans);
      transition: color 0.15s;
    }

    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .tab:hover:not(.active) { color: var(--text-primary); }

    .panel { display: none; padding: 1rem; }
    .panel.active { display: block; }

    .section-top {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .block-card {
      background: var(--bg-secondary);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .block-card:hover { border-color: var(--border-md); }

    .block-head { display: flex; align-items: flex-start; justify-content: space-between; }
    .chain-line { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-tertiary); margin-bottom: 3px; font-family: var(--font-mono); }
    .chain-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); opacity: 0.6; }
    .block-num { font-size: 15px; font-weight: 600; color: var(--gold); font-family: var(--font-mono); }
    .block-time { font-size: 11px; color: var(--text-secondary); }
    .block-hash { font-size: 10px; color: var(--text-tertiary); margin-top: 6px; font-family: var(--font-mono); word-break: break-all; line-height: 1.4; }

    .block-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .block-detail { display: none; margin-top: 12px; border-top: 0.5px solid var(--border); padding-top: 12px; }
    .block-detail.open { display: block; }
    .expand-hint { font-size: 10px; color: var(--text-tertiary); margin-top: 6px; }

    .tx-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 0.5px solid var(--border);
      font-size: 11px;
      gap: 8px;
    }

    .tx-row:last-child { border-bottom: none; }
    .tx-addr { color: var(--text-secondary); font-family: var(--font-mono); font-size: 10px; }
    .tx-arrow { color: var(--text-tertiary); }
    .tx-amount { font-weight: 600; color: var(--text-primary); font-family: var(--font-mono); white-space: nowrap; }

    .badge { font-size: 10px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
    .badge-pending { background: var(--warning-bg); color: var(--warning-text); }
    .badge-confirmed { background: var(--success-bg); color: var(--success-text); }

    .search-row { display: flex; gap: 8px; margin-bottom: 1rem; }

    .search-row input {
      flex: 1;
      padding: 9px 12px;
      font-size: 13px;
      font-family: var(--font-mono);
      background: var(--bg-secondary);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s;
    }

    .search-row input:focus { border-color: var(--gold); }

    .search-row button {
      padding: 9px 18px;
      font-size: 13px;
      cursor: pointer;
      background: var(--gold-light);
      color: var(--gold);
      border: 0.5px solid var(--gold);
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-weight: 600;
      transition: opacity 0.15s;
    }

    .search-row button:hover { opacity: 0.8; }

    .wallet-result {
      background: var(--bg-secondary);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .wallet-balance { font-size: 32px; font-weight: 700; color: var(--gold); font-family: var(--font-mono); }
    .wallet-addr { font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); margin-top: 6px; word-break: break-all; }

    .empty { text-align: center; padding: 2.5rem; color: var(--text-secondary); font-size: 13px; }
    .empty i { font-size: 28px; display: block; margin-bottom: 10px; opacity: 0.5; }

    .error-msg {
      background: var(--danger-bg);
      color: var(--danger-text);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .loading { color: var(--text-secondary); font-size: 13px; padding: 2rem 0; text-align: center; }

    footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    footer a { color: var(--gold); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">₩</div>
      <div>
        <div class="title">WitsCoin Explorer</div>
        <div class="subtitle">COMS4065A · University of the Witwatersrand</div>
      </div>
      <button class="refresh-btn" onclick="refreshAll()">
        <i class="ti ti-refresh"></i> Refresh
      </button>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-label">Latest block</div><div class="stat-val" id="s-block">—</div></div>
      <div class="stat"><div class="stat-label">Difficulty</div><div class="stat-val" id="s-diff">—</div></div>
      <div class="stat"><div class="stat-label">Mining reward</div><div class="stat-val" id="s-reward">—</div></div>
      <div class="stat"><div class="stat-label">Pending txns</div><div class="stat-val" id="s-pending">—</div></div>
    </div>

    <div class="card-wrap">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('blocks', this)">Blocks</button>
        <button class="tab" onclick="switchTab('pending', this)">Pending txns</button>
        <button class="tab" onclick="switchTab('wallet', this)">Wallet lookup</button>
      </div>

      <div class="panel active" id="panel-blocks">
        <div class="section-top">
          <span class="section-title">Recent blocks</span>
          <button class="refresh-btn" style="margin-left:auto" onclick="loadBlocks()"><i class="ti ti-refresh"></i></button>
        </div>
        <div id="blocks-list"><div class="loading">Loading blocks…</div></div>
      </div>

      <div class="panel" id="panel-pending">
        <div class="section-top">
          <span class="section-title">Pending transactions</span>
          <button class="refresh-btn" style="margin-left:auto" onclick="loadPending()"><i class="ti ti-refresh"></i></button>
        </div>
        <div id="pending-list"><div class="loading">Loading…</div></div>
      </div>

      <div class="panel" id="panel-wallet">
        <div class="search-row">
          <input type="text" id="wallet-input" placeholder="Enter wallet address (wc_...)" />
          <button onclick="lookupWallet()"><i class="ti ti-search"></i> Look up</button>
        </div>
        <div id="wallet-result"></div>
      </div>
    </div>

    <footer>
      Built for COMS4065A · Data from <a href="https://witscoin.com" target="_blank">witscoin.com</a>
    </footer>
  </div>

  <script>
    const BASE = 'https://witscoin.com';

    function switchTab(name, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('panel-' + name).classList.add('active');
      if (name === 'pending') loadPending();
    }

    function fmt(ts) {
      if (!ts) return '';
      return new Date(ts * 1000).toLocaleString('en-ZA', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function shortAddr(a) {
      if (!a) return '—';
      return a.length > 22 ? a.slice(0, 10) + '…' + a.slice(-6) : a;
    }

    async function fetchJSON(url) {
      const r = await fetch(BASE + url, { headers: { 'Accept': 'application/json' } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }

    async function loadStats() {
      try {
        const [info, latest, pending] = await Promise.all([
          fetchJSON('/info'),
          fetchJSON('/blockchain/latest'),
          fetchJSON('/problem4/pending')
        ]);
        document.getElementById('s-block').textContent = latest.block_number ?? latest.index ?? '—';
        document.getElementById('s-diff').textContent = info.mining_difficulty ?? '—';
        document.getElementById('s-reward').textContent = (info.mining_reward ?? '—') + ' ₩';
        const pArr = Array.isArray(pending) ? pending : (pending.transactions ?? pending.pending ?? []);
        document.getElementById('s-pending').textContent = pArr.length;
      } catch(e) { console.warn('Stats error', e); }
    }

    function renderTx(tx, confirmed) {
      const badge = confirmed
        ? '<span class="badge badge-confirmed">confirmed</span>'
        : '<span class="badge badge-pending">pending</span>';
      return `<div class="tx-row">
        <div style="min-width:0;flex:1">
          <div class="tx-addr">${shortAddr(tx.from_address || tx.from || tx.sender)} <span class="tx-arrow">→</span> ${shortAddr(tx.to_address || tx.to || tx.recipient)}</div>
          ${tx.timestamp ? `<div style="font-size:10px;color:var(--text-tertiary);margin-top:2px">${fmt(tx.timestamp)}</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span class="tx-amount">${tx.amount} ₩</span>
          ${badge}
        </div>
      </div>`;
    }

    function renderBlock(b, idx) {
      const txs = Array.isArray(b.transactions) ? b.transactions : [];
      const txHtml = txs.length
        ? txs.map(t => renderTx(t, true)).join('')
        : '<div style="font-size:11px;color:var(--text-tertiary);padding:6px 0">No transactions in this block</div>';

      return `<div class="block-card" onclick="toggleBlock(this)">
        <div class="block-head">
          <div>
            <div class="chain-line"><span class="chain-dot"></span> block</div>
            <div class="block-num">#${b.block_number ?? b.index ?? idx}</div>
          </div>
          <div style="text-align:right">
            <div class="block-time">${fmt(b.timestamp)}</div>
            <div style="font-size:11px;color:var(--text-secondary);margin-top:2px">${txs.length} txn${txs.length !== 1 ? 's' : ''} · ${b.reward ?? 50} ₩ reward</div>
          </div>
        </div>
        <div class="block-hash">${b.hash || b.current_hash || ''}</div>
        <div class="block-meta">
          <span><i class="ti ti-user" style="font-size:12px;vertical-align:-1px"></i> ${shortAddr(b.miner_address || b.miner)}</span>
          <span><i class="ti ti-cube" style="font-size:12px;vertical-align:-1px"></i> nonce: ${b.nonce ?? '—'}</span>
        </div>
        <div class="expand-hint">click to ${txs.length ? 'view transactions' : 'expand'} ↓</div>
        <div class="block-detail">${txHtml}</div>
      </div>`;
    }

    function toggleBlock(el) {
      el.querySelector('.block-detail').classList.toggle('open');
      const hint = el.querySelector('.expand-hint');
      hint.textContent = el.querySelector('.block-detail').classList.contains('open') ? 'click to collapse ↑' : 'click to expand ↓';
    }

    async function loadBlocks() {
      const el = document.getElementById('blocks-list');
      el.innerHTML = '<div class="loading">Fetching blocks…</div>';
      try {
        const data = await fetchJSON('/blockchain/blocks');
        const blocks = Array.isArray(data) ? data : (data.blocks ?? data.chain ?? []);
        if (!blocks.length) { el.innerHTML = '<div class="empty">No blocks found.</div>'; return; }
        const sorted = [...blocks].sort((a, b) => (b.block_number ?? b.index ?? 0) - (a.block_number ?? a.index ?? 0));
        el.innerHTML = sorted.map((b, i) => renderBlock(b, i)).join('');
      } catch(e) {
        el.innerHTML = '<div class="error-msg"><i class="ti ti-alert-circle"></i> Failed to load blocks: ' + e.message + '</div>';
      }
    }

    async function loadPending() {
      const el = document.getElementById('pending-list');
      el.innerHTML = '<div class="loading">Fetching pending transactions…</div>';
      try {
        const data = await fetchJSON('/problem4/pending');
        const txs = Array.isArray(data) ? data : (data.transactions ?? data.pending ?? []);
        if (!txs.length) {
          el.innerHTML = '<div class="empty"><i class="ti ti-checks"></i>No pending transactions right now</div>';
          return;
        }
        el.innerHTML = txs.map(t => `<div class="block-card" style="cursor:default">${renderTx(t, false)}</div>`).join('');
      } catch(e) {
        el.innerHTML = '<div class="error-msg"><i class="ti ti-alert-circle"></i> Failed to load: ' + e.message + '</div>';
      }
    }

    async function lookupWallet() {
      const addr = document.getElementById('wallet-input').value.trim();
      const el = document.getElementById('wallet-result');
      if (!addr) { el.innerHTML = '<div class="error-msg">Please enter a wallet address.</div>'; return; }
      el.innerHTML = '<div class="loading">Looking up…</div>';
      try {
        const data = await fetchJSON('/balance/' + encodeURIComponent(addr));
        el.innerHTML = `<div class="wallet-result">
          <div style="font-size:11px;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em">Balance</div>
          <div class="wallet-balance">${data.balance ?? 0} ₩</div>
          <div class="wallet-addr">${data.address ?? addr}</div>
        </div>`;
      } catch(e) {
        el.innerHTML = '<div class="error-msg">Wallet not found or server error: ' + e.message + '</div>';
      }
    }

    document.getElementById('wallet-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') lookupWallet();
    });

    function refreshAll() { loadStats(); loadBlocks(); }
    refreshAll();
  </script>
</body>
</html>
